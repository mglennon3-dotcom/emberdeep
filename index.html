<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0b">
<meta name="description" content="A text-based dungeon crawl. Build a party, roll the dice, and take the Ember Crown from the Hollow King.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emberdeep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Emberdeep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a book-like story column (narrative, choices, command line) beside the party sheet with pack and a text map. Single dark, torchlit world by design. */
:root{
  --void:#0b0c0b;
  --stone:#141715;
  --stone-2:#1c201d;
  --line:#2e3530;
  --parchment:#eadfc6;
  --ink-soft:#cfc4aa;
  --muted:#958f7f;
  --ember:#f0a33a;
  --ember-dim:#9c6420;
  --blood:#e0675d;
  --arcane:#8fb4ea;
  --moss:#9cc072;
  --gold:#e8c95a;
  --mythic:#e2a8ff;
  --f-display:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --f-story:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--void);color:var(--parchment)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
.app{max-width:1200px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;margin:0;color:var(--ember);text-shadow:0 0 18px rgba(240,163,58,.3)}
.depthline{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.depthline b{color:var(--parchment);font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}

.story{height:min(56vh,620px);min-height:300px;overflow-y:auto;background:var(--stone);border:1px solid var(--line);border-radius:4px;padding:18px clamp(14px,3vw,30px);font-family:var(--f-story);font-size:1.08rem;line-height:1.6;display:flex;flex-direction:column;gap:9px}
.story.intro{height:auto;min-height:0}
.story p{margin:0;max-width:66ch}
.story .scene{margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.story .scene:first-child{margin-top:0;border-top:0;padding-top:0}
.story .scene h2{font-family:var(--f-display);font-weight:500;font-size:1.65rem;line-height:1.05;margin:0 0 4px;text-wrap:balance}
.story .scene h2 small{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin-bottom:4px}
.story .scene p+p{margin-top:6px}
.story .cmd{font-family:var(--f-mono);font-size:.82rem;color:var(--ember);margin-top:4px}
.story .d{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:8px;white-space:nowrap}
.story .hit{color:var(--parchment)} .story .crit{color:var(--ember);font-weight:700}
.story .miss{color:var(--muted)} .story .hurt{color:var(--blood)} .story .heal{color:var(--moss)}
.story .loot{color:var(--gold)} .story .magic{color:var(--arcane)} .story .sys{font-family:var(--f-body);font-size:.92rem;color:var(--muted)}
.story .ally{color:#d9cfb6}
.story .big{font-family:var(--f-display);font-size:1.4rem;line-height:1.2;color:var(--ember)}
.story .threat{color:#f0c39a}
.story .event{color:var(--parchment);border-left:2px solid var(--ember-dim);padding-left:12px}
.story .roll{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-soft);background:var(--void);border:1px solid var(--line);border-radius:3px;padding:3px 8px;align-self:flex-start;max-width:100%}
.story .roll.ok{border-color:#3f5a2e;color:var(--moss)} .story .roll.no{border-color:#5a2a25;color:var(--blood)}
.story .mythic{color:var(--mythic)}
.story pre{margin:0;font-family:var(--f-mono);font-size:.85rem;line-height:1.25;color:var(--ink-soft)}

.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.choice{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;align-items:baseline;text-align:left;background:var(--stone-2);border:1px solid var(--line);border-radius:4px;padding:9px 12px;font:inherit;color:var(--parchment);cursor:pointer;min-width:0}
.choice:hover{border-color:var(--ember-dim);background:#231f19}
.choice:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.choice .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);grid-row:span 2}
.choice .l{font-weight:500;font-size:1rem}
.choice .s{grid-column:2;font-size:.82rem;color:var(--muted)}
.choice .s b{font-family:var(--f-mono);font-weight:600;font-size:.76rem;color:var(--ember)}
.choice.fight{border-color:#5a2a25;background:#221614}
.choice.fight:hover{border-color:var(--blood)}
.choice.go .l::before{content:"→ ";color:var(--muted)}
.choice.prime{border-color:var(--ember-dim)} .choice.prime .l{color:var(--ember)}
.choice.hero .l{font-family:var(--f-display);font-size:1.4rem;line-height:1.05}
.choice.myth .l{color:var(--mythic)}
.choice.ev{border-color:#3d3526;background:#1f1b15}
.diff{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:-4px 0 -2px}
.diff button{background:var(--void);border:1px solid var(--line);border-radius:3px;color:var(--muted);font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 0;cursor:pointer}
.diff button.on{border-color:var(--ember-dim);color:var(--ember);background:#231b12}
.diff button:focus-visible{outline:2px solid var(--ember);outline-offset:1px}

form.cmdline{display:flex;gap:8px}
form.cmdline label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
form.cmdline input{flex:1;min-width:0;background:var(--void);border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--parchment);font-family:var(--f-mono);font-size:.9rem}
form.cmdline input::placeholder{color:#6d685c}
form.cmdline input:focus{outline:none;border-color:var(--ember-dim)}
form.cmdline button{background:var(--stone-2);border:1px solid var(--line);border-radius:4px;color:var(--parchment);padding:0 16px;font:inherit;cursor:pointer}

.sheet{background:var(--stone);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:14px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.who .cn{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.who .lv{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{position:relative;height:22px;background:#0c0e0d;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#d9564c,#8f2822)}
.bar.xp{height:10px}.bar.xp>i{background:linear-gradient(180deg,#9fc1ee,#4f75ab)}
.bar.sm{height:8px;margin-top:3px}
.bar>span{position:relative;display:block;text-align:center;font-family:var(--f-mono);font-size:.76rem;line-height:20px;color:#fff;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.scores{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.score{border:1px solid var(--line);border-radius:3px;text-align:center;padding:3px 0 4px;background:var(--stone-2)}
.score small{display:block;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;color:var(--muted)}
.score b{display:block;font-size:1rem;line-height:1.1;font-variant-numeric:tabular-nums}
.score em{font-style:normal;font-family:var(--f-mono);font-size:.68rem;color:var(--ember)}
dl.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:0}
dl.stats div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted var(--line);padding-bottom:2px;min-width:0}
dl.stats dt{color:var(--muted);font-size:.85rem}
dl.stats dd{margin:0;font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums;text-align:right}
.wpn{font-size:.88rem;color:var(--ink-soft)} .wpn b{font-weight:500}
.wpn .m{color:var(--mythic)}
.sheet h3{margin:0 0 6px;font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.abil b{color:var(--ember)} .abil .pips{font-family:var(--f-mono);color:var(--ember);letter-spacing:2px;float:right}
.abil p{margin:2px 0 0;font-size:.85rem;color:var(--ink-soft)}
.party{display:flex;flex-direction:column;gap:8px}
.mate{background:var(--stone-2);border:1px solid var(--line);border-radius:3px;padding:7px 9px;cursor:pointer}
.mate:hover,.mate:focus-visible{border-color:var(--ember-dim);outline:none}
.pack button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:3px 6px;margin:0 -6px;border-radius:3px;cursor:pointer}
.pack button:hover,.pack button:focus-visible,.pack button.on{background:var(--stone-2);outline:1px solid var(--ember-dim)}
.pack li.m button span:first-child{color:var(--mythic)}
.pack button span:last-child{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.sheet h3 .hint{font-weight:400;letter-spacing:.04em;text-transform:none;color:#6d685c;margin-left:6px}
.story .ccard2{font-family:var(--f-body);font-size:.92rem;background:var(--stone-2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;max-width:66ch}
.story .ccard2 .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.story .ccard2 .top b{font-family:var(--f-display);font-weight:500;font-size:1.35rem;line-height:1}
.story .ccard2 .top span,.story .ccard2 .sub,.story .ccard2 .stl{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.story .ccard2 .row{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:.8rem;color:var(--ink-soft)}
.story .ccard2 .row .m{color:var(--mythic)}
.story .ccard2 .fit{color:var(--gold)}
.mate .top{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.mate .nm{font-family:var(--f-display);font-size:1.15rem;line-height:1}
.mate .rl{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);white-space:nowrap}
.mate .ln{font-size:.8rem;color:var(--muted);margin-top:2px}
.mate.down{border-color:#5a2a25}.mate.down .nm::after{content:" · fallen";font-family:var(--f-mono);font-size:.68rem;color:var(--blood)}
.empty{font-size:.85rem;color:var(--muted);margin:0}
.loy{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}.loy.lhi{color:var(--moss)}.loy.lmid{color:var(--gold)}.loy.llo{color:var(--blood)}
.pack{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.pack li{display:flex;justify-content:space-between;gap:8px}
.pack li span:last-child{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.pack li.zero{opacity:.45}
.pack li.m span:first-child{color:var(--mythic)}
pre.map{margin:0;font-family:var(--f-mono);font-size:.95rem;line-height:1.15;color:var(--ink-soft);background:var(--void);border:1px solid var(--line);border-radius:3px;padding:10px;overflow-x:auto}
pre.map .me{color:var(--ember);font-weight:600} pre.map .st{color:var(--arcane)} pre.map .dim{color:#5c584e} pre.map .ev{color:var(--gold)}
.legend{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);margin-top:5px}
.intro-sheet{font-size:.92rem;color:var(--ink-soft);margin:0}
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>Emberdeep</h1>
    <div class="depthline" id="depthline">Eight floors down</div>
  </header>
  <div class="layout">
    <div class="col">
      <div class="story" id="story" aria-live="polite"></div>
      <div class="choices" id="choices"></div>
      <form class="cmdline" id="cmdform" autocomplete="off">
        <label for="cmd">Type a command</label>
        <input id="cmd" type="text" placeholder="Or type a command: go north, attack, search, help" autocapitalize="off" spellcheck="false">
        <button type="submit">Enter</button>
      </form>
    </div>
    <aside class="sheet" id="sheet"></aside>
  </div>
</div>

<script>
(()=>{
const GRID=5,MAX_COMPANIONS=3,SAVE_KEY='emberdeep-party-save-v1';
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const roll=(n,d,b=0)=>{let t=b;for(let i=0;i<n;i++)t+=1+rnd(d);return t};
const dstr=(n,d,b=0)=>`${n}d${d}${b>0?'+'+b:b<0?b:''}`;
const sgn=v=>(v>=0?'+':'')+v;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const key=(x,y)=>x+','+y;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const listJoin=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const DIRV={n:[0,-1,'north'],e:[1,0,'east'],s:[0,1,'south'],w:[-1,0,'west']};
const OPP={n:'s',s:'n',e:'w',w:'e'};
const STATS=['str','dex','con','int','wis','cha'];
const STATNAME={str:'Strength',dex:'Dexterity',con:'Constitution',int:'Intelligence',wis:'Wisdom',cha:'Charisma'};
const UNDEAD=new Set(['skeleton','ghoul','wraith','king','thrall','abbess','ashwight']);
const DRAGONKIN=new Set(['wyvern','wyrm','salamander']);

/* ---------- weapons ---------- */
const WEAPONS={
  dagger:{name:'dagger',n:1,d:4,stat:'finesse'},
  shortsword:{name:'shortsword',n:1,d:6,stat:'finesse'},
  longsword:{name:'longsword',n:1,d:8,stat:'str'},
  mace:{name:'mace',n:1,d:6,stat:'str'},
  warhammer:{name:'warhammer',n:1,d:8,stat:'str'},
  battleaxe:{name:'battleaxe',n:1,d:10,stat:'str'},
  greatsword:{name:'greatsword',n:2,d:6,stat:'str'},
  spear:{name:'spear',n:1,d:8,stat:'str'},
  staff:{name:'quarterstaff',n:1,d:6,stat:'int'},
  longbow:{name:'longbow',n:1,d:8,stat:'dex'},
  crossbow:{name:'hand crossbow',n:1,d:6,stat:'dex'},
  greataxe:{name:'greataxe',n:1,d:12,stat:'str'},
  rapier:{name:'rapier',n:1,d:8,stat:'finesse'},
  shillelagh:{name:'shillelagh',n:1,d:8,stat:'wis'},
  fists:{name:'fists',n:1,d:6,stat:'finesse'},
  cinderfang:{name:'Cinderfang',n:1,d:8,stat:'str',bonus:1,extra:[1,6,'fire'],mythic:true,lore:'+1 longsword wreathed in flame. Every hit adds 1d6 fire.'},
  hush:{name:'Hush',n:1,d:4,stat:'finesse',bonus:2,crit:18,mythic:true,lore:'+2 dagger that whispers. Crits on 18 to 20.'},
  gravewarden:{name:'Gravewarden',n:1,d:8,stat:'str',bonus:1,undead:[2,6],mythic:true,lore:'+1 warhammer of a buried order. +2d6 against the undead.'},
  stormcaller:{name:'Stormcaller',n:1,d:8,stat:'str',bonus:1,storm:true,mythic:true,lore:'+1 copper-bound spear. One hit in three calls lightning for +2d8.'},
  thirst:{name:'the Thirsting Blade',n:2,d:6,stat:'str',bonus:2,leech:true,mythic:true,lore:'+2 greatsword. Heals its wielder for a third of the damage it deals.'},
  moonglass:{name:'Moonglass Staff',n:1,d:6,stat:'int',bonus:1,spell:true,mythic:true,lore:'+1 staff. One more Magic Missile dart, and +1d6 on Fire Bolts.'},
  tidebreaker:{name:'Tidebreaker',n:1,d:8,stat:'finesse',bonus:2,extra:[1,8,'cold'],mythic:true,lore:'+2 trident of the drowned abbey. +1d8 cold on every hit.'},
  wyrmfang:{name:'Wyrmfang',n:1,d:10,stat:'str',bonus:2,slayer:[3,8],mythic:true,lore:'+2 glaive cut from a dragon\u2019s tooth. +3d8 against dragons and their kin.'},
  dawnlance:{name:'Dawnlance',n:1,d:8,stat:'finesse',bonus:2,extra:[1,8,'radiant'],undead:[1,8],mythic:true,lore:'+2 lance of morning light. +1d8 radiant, and another 1d8 against the undead.'},
  kingsbane:{name:'Kingsbane',n:1,d:8,stat:'finesse',bonus:2,extra:[1,8,'radiant'],king:true,mythic:true,lore:'+2 sword reforged in the Ember Forge. +1d8 radiant, and its wounds stop the Hollow King from mending.'},
};
const wdef=w=>{const b=WEAPONS[w.id];return{...b,bonus:(b.bonus||0)+(w.plus||0)}};
const wname=w=>{const b=WEAPONS[w.id];return b.mythic?b.name:(w.plus?`+${w.plus} ${b.name}`:b.name)};
const wdice=(m,w)=>{const d=wdef(w);return dstr(d.n,d.d,statMod(m,w)+d.bonus)+(d.extra?` +${d.extra[0]}d${d.extra[1]} ${d.extra[2]}`:'')};
function statMod(m,w){const d=WEAPONS[w.id];if(d.stat==='finesse')return Math.max(m.stats.str,m.stats.dex);return m.stats[d.stat]}

/* ---------- heroes & companions ---------- */
const CLASSES={
  barbarian:{name:'Barbarian',role:'A storm of muscle and fury. Shrugs off blows that would fell anyone else.',hd:12,ac:14,stats:{str:3,dex:1,con:3,int:-1,wis:0,cha:0},weapon:'greataxe',col:'#e0704f',
    abil:{name:'Rage',charges:2,desc:'For 3 rounds: +2 damage and you take half damage.'},passive:'Primal toughness: the biggest hit die of any class.',names:['Brakka','Ulfa','Torvald'],main:'str'},
  bard:{name:'Bard',role:'A silver tongue and a song that steadies the whole party.',hd:8,ac:13,stats:{str:0,dex:2,con:1,int:1,wis:0,cha:3},weapon:'rapier',col:'#e8a0c8',
    abil:{name:'Song of Courage',charges:2,desc:'Every ally heals 1d6 + CHA and gains +1 to hit for the floor.'},passive:'Expertise: +3 on Charisma checks. Talk your way past almost anything.',names:['Lysander','Marisol','Fennick'],main:'cha'},
  cleric:{name:'Cleric',role:'Armored faith. Keeps the whole party standing.',hd:8,ac:16,stats:{str:2,dex:0,con:1,int:0,wis:3,cha:1},weapon:'mace',col:'#f2e6a0',
    abil:{name:'Healing Word',charges:3,desc:'Heal any ally 1d8 + WIS, even one who has fallen.'},passive:'Fallen allies always pull through after a fight.',names:['Agathe','Cade','Seren'],main:'wis'},
  druid:{name:'Druid',role:'Keeper of the old ways. Can wear the shape of a beast.',hd:8,ac:13,stats:{str:0,dex:1,con:2,int:1,wis:3,cha:0},weapon:'shillelagh',col:'#8fcf8a',
    abil:{name:'Wild Shape',charges:2,desc:'Become a cave bear: gain 10 + 2 × level temporary HP.'},passive:'Shillelagh: your club strikes with Wisdom.',names:['Briar','Oswin','Talwyn'],main:'wis'},
  fighter:{name:'Fighter',role:'Heavy armor and a long blade. Hard to kill.',hd:10,ac:16,stats:{str:3,dex:1,con:2,int:0,wis:0,cha:1},weapon:'longsword',col:'#f0a33a',
    abil:{name:'Second Wind',charges:2,desc:'Recover 1d10 + level HP.'},passive:'Veteran: a short rest restores the whole party to full health.',names:['Aldric','Hesper','Tamsin'],main:'str'},

  log(`${t.name} the ${nc.title} joins your party as a ${nc.cls.toLowerCase()}.`,'big');
  log(`${CLASSES[nc.ck].role} ${t.name} fights with ${CLASSES[nc.ck].abil.name}. ${t.name} values ${VALUES[id]}: ${VALUE_HINT[VALUES[id]]}`,'sys');
}
const LOYAL_WORD=l=>l>=8?'Devoted':l>=6?'Loyal':l>=4?'Steady':l>=2?'Uneasy':l>=1?'Wavering':'Hostile';
function mood(map,quiet=false){
  for(const c of comps()){
    let d=map[c.id];if(d==null)d=map['*'];if(!d)continue;
    if(c.loyalty==null)c.loyalty=6;const before=c.loyalty;c.loyalty=Math.max(-3,Math.min(10,c.loyalty+d));
    if(!quiet)log(`${c.name} ${d>0?(d>1?'approves strongly':'approves'):(d<-1?'is furious':'disapproves')}.`,d>0?'heal':'threat',`loyalty ${before} → ${c.loyalty}`);
    if(c.loyalty<=2&&before>2&&c.loyalty>0)log(`${c.name} has gone very quiet. Something is wrong.`,'hurt');
    if(c.loyalty<=0&&!c.betraying)triggerBetrayal(c);
  }
}
function triggerBetrayal(c){
  c.betraying=true;
  if(c.id==='corvin'&&room().mons.some(m=>m.aware)){
    log(`In the middle of the fight, Corvin steps back from the line. “Better offer,” he says, and turns his blade on you.`,'big');
    turnHostile(c);return;
  }
  G.evQueue=G.evQueue||[];G.evQueue.push({id:c.id==='pip'?'pip_thief':'betray',who:c.id});
}
function turnHostile(c){
  G.party=G.party.filter(m=>m!==c);G.flags['traitor_'+c.id]=true;
  const w=wdef(c.weapon),caster=c.role==='caster',st=WEAPONS[c.weapon.id].stat;
  const mod=caster?c.stats[ckOf(c)==='wizard'?'int':'cha']:(st==='finesse'||st==='dex')?Math.max(c.stats.dex,c.stats.str):c.stats.str;
  const m={k:'traitor',name:c.name,traitor:true,id:c.id,hp:Math.max(c.hp,Math.ceil(c.maxhp*.6)),maxhp:c.maxhp,ac:c.acBase,hit:prof()+mod+w.bonus,
    dmg:caster?[G.lvl>=5?2:1,10,0]:[w.n,w.d,mod+w.bonus],xp:10+G.lvl*6,slow:false,boss:false,aware:true,tick:0,tag:'',scorched:false,weapon:c.weapon};
  room().mons.push(m);G.fighting=true;
}

const E={
  fight(keys,after=null,{surprise=false}={}){
    const r=room(),extra=comps().length>=3?2:comps().length>=2?1:0,t=monTable();keys=keys.slice();
    for(let i=0;i<extra;i++)keys.push(pick(t).k);
    for(const k of keys){const t0=MONK[k],m=makeMon(t0);m.aware=!surprise;
      const gap=chap().mons.includes(t0)?t0.min-G.depth:0;
      if(gap>0){const f=Math.max(.45,1-gap*.15);m.maxhp=m.hp=Math.max(4,Math.round(m.hp*f));m.hit=Math.max(2,m.hit-gap);m.dmg=[m.dmg[0],m.dmg[1],Math.max(0,m.dmg[2]-gap)];m.xp=Math.max(3,Math.round(m.xp*f));m.ac=Math.max(10,m.ac-Math.ceil(gap/2))}
      r.mons.push(m)}retag(r);
    if(extra)log(`${extra>1?'More of them come':'Another one comes'} running at the sound. A bigger party draws a bigger crowd.`,'threat');
    G.ev.waiting=true;G.ev.after=after;if(!surprise)G.fighting=true;
  },
  give(id){G.pack.weapons.push({id,plus:0});const d=WEAPONS[id];log(`You gain ${d.name}. ${d.lore}`,'mythic');log(`Equip it, or hand it to a companion, from Party & gear.`,'sys')},
  item(k){take(newItem(k),true)},
  gold(n){if(n==null)return G.gold;G.gold=Math.max(0,G.gold+n);return G.gold},
  dmg(n,d,b=0,what='a wound'){const h=H(),x=roll(n,d,b);h.hp-=x;log(`You take ${x} damage.`,'hurt',dstr(n,d,b));if(h.hp<=0){h.hp=0;die(what)}return x},
  healAll(){for(const m of G.party){m.down=false;m.hp=m.maxhp}},
  maxhp(n){const h=H();h.bonusHP+=n;h.maxhp=calcMax(h);h.hp=Math.min(h.maxhp,h.hp+Math.max(0,n));if(h.hp<=0){h.hp=1}},
  flag(k){G.flags[k]=true},has:k=>!!G.flags[k],
  farSight(){for(const r of Object.values(G.rooms))r.seen=true;G.farSight=true},
  recruit,mood,
  full:()=>comps().length>=MAX_COMPANIONS,
};

    potion:{t:'“A fine choice!”',fx:()=>{E.gold(-20);G.pack.potion++;log('You buy a Healing Draught.','loot')},next:'start'},
    scroll:{t:'“Handle it carefully.”',fx:()=>{E.gold(-30);G.pack.fire++;log('You buy a Scroll of Cinders.','loot')},next:'start'},
    weapon:{t:'“It was a pleasure, truly.”',fx:()=>{E.gold(-90);E.give(G.ev.stock);G.ev.stock=null},next:'start'},
    deal:{t:'“You drive a hard bargain for someone with skin.”',fx:()=>{E.gold(-50);E.give(G.ev.stock);G.ev.stock=null},next:'start'},
    nodeal:{t:'“Ninety. I have to eat. Well, no, I don’t. But ninety.”',fx:()=>{G.ev.haggled=true},next:'start'},
    stole:{t:'While he polishes a skull, you lift the weapon and walk away. He never notices.',fx:()=>{E.give(G.ev.stock);G.ev.stock=null;E.flag('robbed_merchant');E.mood({pip:2,ysolde:-2,brannoc:-2})},end:true},
    caught:{t:'“THIEF!” His jaw drops off with the force of it. Two bodyguards step out of the shadows.',fx:()=>E.fight(['skeleton','skeleton'])},
    leave:{t:'“Come back soon! Or don’t. Most don’t.”',end:true}}},

  orc:{min:2,max:5,title:'The deserter',nodes:{
    start:{t:'An orc sits propped against the wall, one leg bent the wrong way. His axe is out of reach. He looks at you and doesn’t bother to beg. “Go on, then.”',o:[
      {l:'Give him a Healing Draught',if:()=>G.pack.potion>0,go:'help'},
      {l:'Set his leg',check:['wis',13],ok:'set',no:'setno'},
      {l:'End his suffering',go:'kill'},
      {l:'Leave him',go:'leave'}]},
    help:{t:'He drinks it, stares at you, and laughs. “Gruk. I left the warband. They’ll be waiting further down. When they see you, I will be there.”',fx:()=>{G.pack.potion--;E.flag('orc_friend');E.mood({ysolde:1,brannoc:1})},end:true},
    set:{t:'You set the bone with a sharp crack. He grunts, then grins. “Gruk. I left the warband. They’ll be waiting further down. When they see you, I will be there.”',fx:()=>{E.flag('orc_friend');E.mood({ysolde:1,brannoc:1})},end:true},
    setno:{t:'You make it worse. He howls and shoves you away. “Go. Just go.”',end:true},
    kill:{t:'It is quick. On his belt you find a pouch of gold, and a carved tusk bearing the mark of his warband.',fx:()=>{E.gold(roll(3,6,10));E.flag('orc_killed');E.mood({ysolde:-2,brannoc:-1,pip:1})},end:true},
    leave:{t:'You leave him in the dark.',fx:()=>E.mood({ysolde:-1}),end:true}}},

  warband:{min:6,max:8,need:()=>E.has('orc_friend')||E.has('orc_killed'),must:()=>true,title:'The warband',nodes:{
    start:{t:()=>E.has('orc_friend')?'Orcs fill the hall, a whole warband, axes ready. Then a familiar shape limps to the front. “This one,” says Gruk, “fixed my leg.” The warband lowers its axes.':'Orcs fill the hall, a whole warband. Their chief holds up a carved tusk, the twin of the one you took. “You killed my brother.”',o:[
      {l:'Ask Gruk to join you',if:()=>E.has('orc_friend'),go:'gruk'},
      {l:'Ask for safe passage and a gift',if:()=>E.has('orc_friend'),go:'passage'},
      {l:'Tell him his brother died well',if:()=>E.has('orc_killed'),check:['cha',15],ok:'calm',no:'fight'},
      {l:'Fight',if:()=>E.has('orc_killed'),go:'fight'}]},
    gruk:{t:()=>`Gruk ${ready('gruk')}. “A debt is a debt.”`,fx:()=>E.recruit('gruk',8),end:true},
    passage:{t:'The chief tosses you a battleaxe. “For fixing my idiot brother.” The warband parts to let you through.',fx:()=>{G.pack.weapons.push({id:'battleaxe',plus:2});log('You gain a +2 battleaxe.','loot')},end:true},
    calm:{t:'The chief is silent a long time. “Then go. Before I change my mind.”',end:true},
    fight:{t:'The warband roars and charges.',fx:()=>E.fight(['orc','orc'].concat(comps().length>=2?['orc']:[]))}}},

  bones_brannoc:{min:3,max:6,need:()=>E.has('left_brannoc'),must:()=>true,title:'Left behind',nodes:{
    start:{t:'The dwarf you left at the goblins’ cart lies against the wall. They worked him until he dropped. His hammer is still in his hand.',o:[
      {l:'Take his hammer',go:'take'},{l:'Build him a cairn',go:'cairn'}]},
    take:{t:'You pry the hammer from his fingers. It is good steel.',fx:()=>{G.pack.weapons.push({id:'warhammer',plus:1});log('You gain a +1 warhammer.','loot')},end:true},
    cairn:{t:'You pile stones over him, one by one. When you are done you feel steadier, as if someone were watching your back. +1 AC for the rest of this floor... and a little longer.',fx:()=>{H().acb++},end:true}}},
};
Object.assign(EVENTS,{
  betray:{special:true,repeat:true,title:'Betrayal',nodes:{
    start:{t:ev=>BETRAY[ev.who],o:[
      {l:ev=>`Talk ${COMPS[ev.who].name} down`,check:['cha',14],ok:'calm',no:'turn'},
      {l:ev=>`Pay ${COMPS[ev.who].name} off: ${payoff()} gold`,if:()=>G.gold>=payoff(),go:'paid'},
      {l:ev=>`Let ${COMPS[ev.who].name} go`,sub:'They leave with their weapon',go:'leave'},
      {l:'Draw your weapon',sub:'Fight them',go:'fight'}]},
    calm:{t:ev=>`You talk for a long time. Slowly, ${COMPS[ev.who].name} lowers their weapon. “One more chance. Don’t waste it.”`,fx:ev=>{const c=G.party.find(m=>m.id===ev.who);if(c){c.loyalty=4;c.betraying=false}},end:true},
    paid:{t:ev=>`${COMPS[ev.who].name} weighs the purse, nods once, and walks away into the dark without looking back.`,fx:ev=>{E.gold(-payoff());leaveParty(ev.who)},end:true},
    leave:{t:ev=>`${COMPS[ev.who].name} backs away, then turns and is gone. You hear their footsteps for a long time.`,fx:ev=>leaveParty(ev.who),end:true},
    turn:{t:ev=>`Your words only make it worse. ${COMPS[ev.who].name} attacks!`,fx:ev=>{const c=G.party.find(m=>m.id===ev.who);if(c){turnHostile(c);G.ev.waiting=true;G.ev.after=null}}},
    fight:{t:ev=>`Steel rings as you draw. ${COMPS[ev.who].name} comes at you.`,fx:ev=>{const c=G.party.find(m=>m.id===ev.who);if(c){turnHostile(c);G.ev.waiting=true;G.ev.after=null}}}}},
  pip_thief:{special:true,repeat:true,title:'Light fingers',nodes:{
    start:{t:'A soft clink. You look up to see Pip halfway out of the room, your coin purse in one hand and a Healing Draught in the other.',o:[
      {l:'Grab him',check:['dex',13],ok:'caught',no:'gone'},
      {l:'Shout at him to stop',check:['cha',15],ok:'caught',no:'gone'},
      {l:'Let him go',go:'gone'}]},
    caught:{t:'You catch him by the tail. He drops everything and covers his face. “Pip is sorry! Pip is SO sorry!”',o:[
      {l:'Forgive him',sub:'He stays, but he is uneasy',go:'forgive'},{l:'Send him away',go:'out'},{l:'Strike him down',go:'kill'}]},
    forgive:{t:'He snivels his thanks and stays very close to you after that.',fx:()=>{const c=G.party.find(m=>m.id==='pip');if(c){c.loyalty=3;c.betraying=false}},end:true},
    out:{t:'You point at the dark. Pip goes, muttering.',fx:()=>leaveParty('pip'),end:true},
    kill:{t:'He never sees it coming.',fx:()=>{const c=G.party.find(m=>m.id==='pip');leaveParty('pip');G.flags.dead_pip=true;if(c)G.pack.weapons.push(c.weapon);E.mood({ysolde:-2,brannoc:-1,gruk:1})},end:true},
    gone:{t:'He is gone before you can reach him.',fx:()=>{const n=Math.floor(G.gold/2),p=G.pack.potion>0;E.gold(-n);if(p)G.pack.potion--;leaveParty('pip');return `Pip took ${n} gold${p?' and a Healing Draught':''} with him.`},end:true}}},
  wages:{special:true,repeat:true,title:'Wages',nodes:{
    start:{t:'At the foot of the stairs, Corvin holds out his hand. “Wages. Fifteen a floor, as agreed.”',o:[
      {l:'Pay him 15 gold',if:()=>G.gold>=15,go:'paid'},
      {l:'Pay him 30, with thanks',sub:'A bonus buys loyalty',if:()=>G.gold>=30,go:'bonus'},
      {l:'Ask him to wait until the next floor',check:['cha',13],ok:'wait',no:'refused'},
      {l:'Refuse',go:'refused'}]},
    paid:{t:'He counts it and pockets it. “Good.”',fx:()=>{E.gold(-15);E.mood({corvin:1})},end:true},
    bonus:{t:'He raises an eyebrow, then smiles for the first time. “You’re all right.”',fx:()=>{E.gold(-30);E.mood({corvin:3})},end:true},
    wait:{t:'“Fine. Next floor. Don’t make me ask twice.”',fx:()=>E.mood({corvin:-1}),end:true},
    refused:{t:'His jaw tightens. He says nothing at all.',fx:()=>E.mood({corvin:-3}),end:true}}},
  share:{special:true,repeat:true,title:'Pip’s share',nodes:{
    start:{t:'Pip tugs at your sleeve and eyes your purse. “Pip carried things. Pip found things. Pip wants a share. Ten gold?”',o:[
      {l:'Give him 10 gold',if:()=>G.gold>=10,go:'paid'},
      {l:'Give him a weapon from your pack',if:()=>G.pack.weapons.length>0,go:'weapon'},
      {l:'Promise him a bigger share at the end',check:['cha',12],ok:'promise',no:'sulk'},
      {l:'Tell him no',go:'sulk'}]},
    paid:{t:'He bites every coin and does a little dance.',fx:()=>{E.gold(-10);E.mood({pip:2})},end:true},
    weapon:{t:'His eyes go wide. He clutches it like a baby.',fx:()=>{const w=G.pack.weapons.shift();log(`You give Pip the ${wname(w)}. He will probably sell it.`,'loot');E.mood({pip:3})},end:true},
    promise:{t:'“A BIGGER share. Pip will remember.”',end:true},
    sulk:{t:'He sulks and kicks a pebble into the dark.',fx:()=>E.mood({pip:-2}),end:true}}},
});
Object.assign(EVENTS,{
  /* chapter 2: the Drowned Abbey */
  novice:{ch:1,min:1,max:5,recruit:true,title:'The bell rope',nodes:{
    start:{t:'In a bell tower half full of water, a young novice clings to the bell rope above the surface. Below her, a drowned thrall waits with its arms out. \u201cPlease,\u201d she whispers. \u201cI\u2019ve been praying for three days.\u201d',o:[
      {l:'Attack the thrall',go:'fight'},
      {l:'Swim under and pull her across',check:['str',14],ok:'swim',no:'swimno'},
      {l:'Ring the bell to drive it off',sub:'Thralls hate the bell',check:['wis',13],ok:'bell',no:'swimno'},
      {l:'Leave her',go:'leave'}]},
    fight:{t:'You wade in. The thrall turns with a sound like a sigh.',fx:()=>E.fight(['thrall'],'thanks')},
    swim:{t:'You dive, haul her down and across, and come up gasping on the far side. The thrall never sees you.',next:'thanks'},
    bell:{t:'You grab the rope and haul. The bell booms through the water, and the thrall flees, clutching its ears.',next:'thanks'},
    swimno:{t:'It goes wrong. The thrall lunges for you instead.',fx:()=>E.fight(['thrall'],'thanks')},
    thanks:{t:'\u201cNell. Sister Nell, I suppose, though I never took my vows.\u201d She wrings out her habit. \u201cThe Lady of the Waters kept me alive for a reason. Maybe it\u2019s you.\u201d',o:[
      {l:'Ask her to come with you',sub:()=>gainSub('nell'),go:'join'},
      {l:'Send her to the surface with a blessing',sub:'She has something to give',go:'gift'}]},
    join:{t:'\u201cThen I\u2019ll pray for all of us.\u201d',fx:()=>E.recruit('nell',7),end:true},
    gift:{t:'She presses a vial of holy water into your hands and kisses your forehead. Everyone feels steadier. +4 maximum HP.',fx:()=>{E.maxhp(4);G.pack.potion++;E.mood({ysolde:1})},end:true},
    leave:{t:'Her prayers follow you down the corridor.',fx:()=>E.mood({ysolde:-1,brannoc:-1,nell:-1,ilvar:-1}),end:true}}},
  diver:{ch:1,min:1,max:5,recruit:true,title:'The salvage diver',nodes:{
    start:{t:'A man in a brass diving helmet is up to his chest in water, beating an eel swarm off with a crowbar. \u201cDon\u2019t just stand there!\u201d he shouts, muffled. \u201cThere\u2019s a fortune down here and I\u2019m not dying before I find it!\u201d',o:[
      {l:'Help him fight the eels',go:'fight'},
      {l:'Throw him a rope',check:['dex',13],ok:'rope',no:'ropeno'},
      {l:'Wait to see who wins',go:'wait'}]},
    fight:{t:'You charge into the water.',fx:()=>E.fight(['eels'],'thanks')},
    rope:{t:'He grabs the rope and you haul him out, eels snapping at his boots.',next:'thanks'},
    ropeno:{t:'The rope falls short. The eels turn toward you.',fx:()=>E.fight(['eels'],'thanks')},
    wait:{t:'The eels win. When they are gone, you find his diving bag on the floor. It holds gold.',fx:()=>{E.gold(roll(4,10,20));E.mood({ysolde:-2,nell:-2,brannoc:-2,ilvar:-2,oskar:0,pip:1})},end:true},
    thanks:{t:'He pulls off the helmet. \u201cOskar Haddeck, salvage and recovery. Look, I know where the abbey treasury is. You get me there alive, we split it. Deal?\u201d',o:[
      {l:'Shake on it',sub:()=>gainSub('oskar'),go:'join'},
      {l:'Ask for his finder\u2019s fee up front',go:'fee'}]},
    join:{t:'\u201cPartners, then.\u201d He sketches the floor on the wall with chalk.',fx:()=>{E.recruit('oskar',6);E.farSight()},end:true},
    fee:{t:'He grumbles, but hands over a pouch. \u201cFine. Good luck finding anything without me.\u201d',fx:()=>E.gold(roll(3,10,25)),end:true}}},
  reliquary:{ch:1,min:1,max:5,title:'Tidebreaker',nodes:{
    start:{t:'A trident hangs above a flooded altar, held up by nothing. Water spirals around its prongs. An inscription reads: THE SEA GIVES TO THOSE WHO GIVE TO IT.',o:[
      {l:'Throw 30 gold into the water',if:()=>G.gold>=30,go:'give'},
      {l:'Give a Healing Draught to the water',if:()=>G.pack.potion>0,go:'potion'},
      {l:'Just take it',check:['str',15],ok:'grab',no:'grabno'},
      {l:'Leave it',go:'leave'}]},
    give:{t:'The coins sink. The trident drifts down into your hands.',fx:()=>{E.gold(-30);E.give('tidebreaker')},end:true},
    potion:{t:'You pour the draught in. The water glows, and the trident drifts down into your hands.',fx:()=>{G.pack.potion--;E.give('tidebreaker')},end:true},
    grab:{t:'You wrench it from the spiral. The water thrashes, then goes still. It is yours.',fx:()=>{E.give('tidebreaker');E.mood({nell:-1})},end:true},
    grabno:{t:'The water hurls you across the room.',fx:()=>E.dmg(3,6,0,'an angry sea'),next:'start'},
    leave:{t:'You leave the sea its trident.',end:true}}},
  organ:{ch:1,min:1,max:5,title:'The drowned organ',nodes:{
    start:{t:'A great organ rises from the water, its keys yellow as old teeth. Sheet music is pinned above it: a hymn, with one bar scratched out. A sealed door stands beside it.',o:[
      {l:'Play the hymn and guess the missing bar',check:['int',14],ok:'open',no:'wrong'},
      {l:'Play it from the heart',check:['cha',14],ok:'open',no:'wrong'},
      {l:'Force the door',check:['str',16],ok:'forced',no:'wrongforce'},
      {l:'Leave it',go:'leave'}]},
    open:{t:'The last chord rings through the water. The door grinds open on a small vault.',fx:()=>{const l=[newItem('potion'),newItem('potion'),newItem('fire'),{k:'gold',amt:roll(6,10,40)}];room().items.push(...l);log(`Inside: ${listJoin(l.map(itemName))}.`,'loot')},end:true},
    forced:{t:'The door gives with a crack. Inside is a vault of gold.',fx:()=>{room().items.push({k:'gold',amt:roll(6,10,40)});E.mood({tessaly:-1})},end:true},
    wrong:{t:'The wrong note echoes. The water stirs, and drowned things climb out of it.',fx:()=>E.fight(['thrall','thrall'])},
    wrongforce:{t:'The door holds, and the noise wakes something.',fx:()=>E.fight(['thrall','thrall'])},
    leave:{t:'You leave the organ to its silence.',end:true}}},
  confession:{ch:1,min:2,max:6,title:'The confessional',nodes:{
    start:{t:'A confessional stands in the water, its curtain drawn. A soft voice speaks from inside. \u201cYou have done things down here. Tell me, and be lighter.\u201d',o:[
      {l:'Confess honestly',check:['wis',12],ok:'honest',no:'honestno'},
      {l:'Lie',check:['cha',15],ok:'lie',no:'lieno'},
      {l:'Tear back the curtain',go:'curtain'}]},
    honest:{t:'You tell the truth. It is harder than any fight. When you step out, your companions look at you differently.',fx:()=>E.mood({'*':1}),end:true},
    honestno:{t:'You start to talk, and stop. The voice sighs. \u201cAnother time.\u201d',end:true},
    lie:{t:'The voice laughs softly. \u201cA good liar. Take this, then.\u201d A scroll slides out under the curtain.',fx:()=>{E.item('map');E.mood({nell:-1,ysolde:-1})},end:true},
    lieno:{t:'\u201cLiar,\u201d says the voice, and the curtain tears open on a siren.',fx:()=>E.fight(['siren'])},
    curtain:{t:'A siren is crouched inside, grinning.',fx:()=>E.fight(['siren'])}}},

  /* chapter 3: the Ashen Spire */
  knight:{ch:2,min:1,max:5,recruit:true,title:'Dragon food',nodes:{
    start:{t:'A knight in dented plate is chained to a post at the edge of a sheer drop, left as a meal for something with wings. Ash cultists stand guard, chanting. The knight looks up. \u201cIf you\u2019re going to help, now would be ideal.\u201d',o:[
      {l:'Attack the cultists',go:'fight'},
      {l:'Disguise yourself as a cultist and walk him out',check:['cha',15],ok:'disguise',no:'caught'},
      {l:'Pick his chains while they chant',check:['dex',15],ok:'chains',no:'caught'},
      {l:'Leave him to the wyrm',go:'leave'}]},
    fight:{t:'The cultists break off chanting and draw curved knives.',fx:()=>E.fight(['cultist','cultist'],'thanks')},
    disguise:{t:'Smeared with ash, you walk up, unchain him, and march him away. No one questions it.',next:'thanks'},
    chains:{t:()=>`The chains fall away. The knight stands, rolls his shoulders, and ${grab('ilvar')}. \u201cMy turn.\u201d`,fx:()=>{E.recruit('ilvar',8);E.fight(['cultist','cultist'],'joined',{surprise:true})}},
    caught:{t:'A cultist sees you. Knives come out.',fx:()=>E.fight(['cultist','cultist'],'thanks')},
    thanks:{t:'\u201cIlvar, once of the Order of the Scale. I hunted Vharzhul for twenty years. My order is ash now. I would very much like to finish the job.\u201d',o:[
      {l:'Welcome him',sub:()=>gainSub('ilvar'),go:'join'},
      {l:'Ask what he knows about the wyrm',sub:'He has something for you',go:'gift'}]},
    join:{t:'\u201cThen we go up together.\u201d',fx:()=>E.recruit('ilvar',8),end:true},
    gift:{t:'He unbuckles a long, pale glaive. \u201cCut from a dragon\u2019s tooth. My order made it for this. Use it better than I did.\u201d',fx:()=>E.give('wyrmfang'),end:true},
    joined:{t:()=>`Ilvar ${after('ilvar')}. \u201cIlvar, of the Order of the Scale. I owe you, and I mean to stay until it\u2019s paid.\u201d`,end:true},
    leave:{t:'You walk on. Behind you, the chanting gets louder.',fx:()=>E.mood({brannoc:-2,ysolde:-1,nell:-1,zeph:-2}),end:true}}},
  gargoyle:{ch:2,min:1,max:5,recruit:true,title:'The chained gargoyle',nodes:{
    start:{t:'A gargoyle is chained to the wall by iron through its wings. It is half turned to stone, and it watches you with one moving eye. \u201cThe cultists keep me as a doorstop,\u201d it rumbles. \u201cBreak the chains, and I will break things for you.\u201d',o:[
      {l:'Break the chains',check:['str',14],ok:'free',no:'freeno'},
      {l:'Pick the locks',check:['dex',14],ok:'free',no:'freeno'},
      {l:'Ask what it would give you',go:'bargain'},
      {l:'Leave it chained',go:'leave'}]},
    free:{t:'The last chain snaps. The gargoyle stretches stone wings that have not moved in a hundred years.',next:'thanks'},
    freeno:{t:'The chains hold. The noise brings company.',fx:()=>E.fight(['cultist'],'free2')},
    free2:{t:'With the cultist dead, you find the key on its belt.',next:'thanks'},
    bargain:{t:'\u201cI know where they hide their gold. Free me, and it is yours.\u201d',o:[{l:'Free it',check:['str',12],ok:'gold',no:'freeno'},{l:'Leave it chained',go:'leave'}]},
    gold:{t:'Free, the gargoyle tears open a hidden compartment in the wall. Gold spills out.',fx:()=>{E.gold(roll(6,10,30))},next:'thanks'},
    thanks:{t:'\u201cZeph. That is my name. I have not said it in a long time.\u201d It flexes its claws. \u201cI go where you go, until I am tired of you.\u201d',o:[{l:'Take Zeph with you',go:'join'},{l:'Tell Zeph to fly free',go:'fly'}]},
    join:{t:'Zeph falls in behind you, heavy as a landslide.',fx:()=>E.recruit('zeph',7),end:true},
    fly:{t:'Zeph looks at you for a long moment, then leaps from the window and is gone. A little later, a shower of stolen gold rains down outside.',fx:()=>{E.gold(roll(4,10,20));E.mood({'*':1})},end:true},
    leave:{t:'Its eye follows you out of the room.',fx:()=>E.mood({brannoc:-1,ysolde:-1,nell:-1}),end:true}}},
  eggs:{ch:2,min:3,max:5,title:'The clutch',nodes:{
    start:{t:'In a nest of melted gold lie three eggs, each as big as a barrel and hot as a forge. Something inside one of them is moving.',o:[
      {l:'Smash the eggs',go:'smash'},
      {l:'Take the eggs with you',sub:'They are very heavy',check:['str',13],ok:'take',no:'takeno'},
      {l:'Leave them alone',go:'leave'}]},
    smash:{t:'It is ugly work. When it is done, you feel the whole spire shudder, as if something far above has felt it too.',fx:()=>{E.flag('eggs_smashed');E.mood({zeph:-2,nell:-1,gruk:1,ilvar:1})},end:true},
    take:{t:'You wrap the eggs in cloaks and carry them between you. They are warm, and they hum. Perhaps they will be worth something to someone.',fx:()=>{E.flag('eggs_taken');E.mood({oskar:2,pip:2})},end:true},
    takeno:{t:'One egg slips and cracks. Something small and furious crawls out.',fx:()=>E.fight(['salamander'])},
    leave:{t:'You leave the eggs to their warmth.',fx:()=>E.mood({zeph:1,nell:1}),end:true}}},
  dawn:{ch:2,min:1,max:5,title:'Dawnlance',nodes:{
    start:{t:'A shaft of light falls through a crack in the spire onto a burned shrine. In the light lies a lance, untouched by the ash around it. The light is fading as the sun moves.',o:[
      {l:'Kneel and pray before taking it',check:['wis',13],ok:'got',no:'late'},
      {l:'Grab it before the light goes',check:['dex',14],ok:'got',no:'late'},
      {l:'Leave it in the light',go:'leave'}]},
    got:{t:'The lance is warm in your hands. It glows faintly, like dawn.',fx:()=>E.give('dawnlance'),end:true},
    late:{t:'The light slides away, and the lance crumbles to ash as the shadow covers it.',end:true},
    leave:{t:'You leave it shining.',end:true}}},
  defector:{ch:2,min:1,max:5,title:'The defector',nodes:{
    start:{t:'An ash cultist stands with both hands raised. \u201cDon\u2019t! I want out. I know a secret way up, past the guards. Just let me live.\u201d',o:[
      {l:'Let him show you',check:['wis',13],ok:'true',no:'trap'},
      {l:'Make him swear on his life first',check:['cha',12],ok:'true',no:'trap'},
      {l:'Kill him',go:'kill'},
      {l:'Let him go',go:'go'}]},

  const d=G.depth;

  const must=avail.filter(([,e])=>e.must&&e.must()).map(x=>x[0]);
  const rec=shuffle(avail.filter(([id,e])=>e.recruit&&!must.includes(id))).map(x=>x[0]);
  const other=shuffle(avail.filter(([id,e])=>!e.recruit&&!must.includes(id))).map(x=>x[0]);
  const out=[...must];
  if(comps().length<MAX_COMPANIONS&&rec.length&&(d===1||Math.random()<.8))out.push(rec.shift());
  if(d<=2&&rec.length&&Math.random()<.5)out.push(rec.shift());
  const target=Math.max(out.length,2+(d>=3?1:0));

/* ---------- movement ---------- */

function move(dk){const k=room().exits[dk];if(k)enterRoom(k)}

/* ---------- combat ---------- */
function d20(adv){const a=roll(1,20);if(!adv)return{r:a,t:`d20 ${a}`};const b=roll(1,20);return{r:Math.max(a,b),t:`d20 (${a}, ${b})`}}

  log(`${how}${verb} for ${dmg} damage.${storm?' Lightning cracks down the shaft!':''}${torch?' His flesh sizzles.':''}`,crit?'crit':att.hero?'hit':'ally',`${det} · ${ex.join(' + ')}`);

function hurt(m,dmg){if(m.k==='abbess'&&room().mons.some(o=>o.k==='siren')){dmg=Math.max(1,Math.floor(dmg/2));if(!m._shieldMsg){m._shieldMsg=1;log('The sirens\u2019 song shields the Abbess. Only half the damage lands.','magic')}}

  if(m.boss){
    const t={king:'The Hollow King staggers, drops to one knee, and comes apart into ash and old iron. The Ember Crown rolls across the floor and stops at your feet.',
      abbess:'The Drowned Abbess sinks slowly to the floor of her reef. The choir falls silent, all at once, for the first time in two hundred years. The Tide Crown drifts down into the sand.',
      wyrm:'Vharzhul rears up, roars one last gout of flame at the sky, and crashes down across his hoard. Gold slides and rings for a long time. The Sky Crown slips from his horn and rolls to your feet.'}[m.k];
    log(t,'big');r.items.push({k:chap().prize,amt:1});return}

  log(`${cap(theM(m))} ${m.k==='skeleton'?'collapses into a pile of bones':m.k==='ooze'?'spreads into a harmless puddle':m.k==='wraith'?'fades with a long sigh':'falls and does not get up'}.`,'text',`+${m.xp} XP`);
  if(Math.random()<.35)r.items.push({k:'gold',amt:roll(1,8,G.depth*2)});

}
function gainXP(n){

function pickTarget(){

  let r=Math.random()*tot;for(let i=0;i<alive.length;i++){if((r-=w[i])<0)return alive[i]}return alive[0];
}
function monAttack(m){

function spellBolt(c,tgt,stat,name='Fire Bolt',type='fire'){

function compAct(c){

function buildChoices(){

function runChoice(c){
  if(!c)return;
  if(G&&c.echo)G.log.push({t:'cmd',text:c.label});

  if(G&&!G.over&&c.combat)round();
  if(G&&!G.over)processQueue();
  save();render();
}

/* ---------- command parser ---------- */
const norm=s=>(' '+s.toLowerCase().replace(/[^a-z0-9 ]/g,' ')+' ').replace(/ (the|a|an|at|to|on|my) /g,' ').replace(/ (the|a|an|at|to|on|my) /g,' ').replace(/\s+/g,' ').trim();
const HELP='Tap a choice, or type a command. Try: north (or n), attack goblin, search, take, drink, open chest, rest, descend, flee, gear. Also: look, party, inventory, map, help. A number picks that choice.';
function runCommand(raw){
  const t=norm(raw);if(!t)return;
  const C=choiceCache;
  if(!G){
    if(titleState.stage==='name'&&!/^\d+$/.test(t)&&!C.some(c=>c.cmds.includes(t))){const nm=raw.trim().slice(0,24).replace(/[<>&"]/g,'');if(nm){start(titleState.cls,nm.charAt(0).toUpperCase()+nm.slice(1));save();render()}return}
    const c=/^\d+$/.test(t)?C[+t-1]:C.find(c=>c.cmds.includes(t)||norm(c.label)===t);
    if(c)runChoice(c);else{titleLog.push({t:'p',text:'Choose a class to begin: type fighter, rogue, wizard or cleric.',cls:'sys'});render()}
    return;
  }
  G.log.push({t:'cmd',text:raw.trim().slice(0,80)});
  if(/^\d+$/.test(t)){const c=C[+t-1];if(c){c.echo=false;runChoice(c)}else{log(`There is no choice ${t}.`,'sys');render()}return}
  if(['help','h','commands'].includes(t)){log(HELP,'sys');render();return}
  if(['look','l','describe'].includes(t)){describe(room());if(G.ev&&!G.ev.waiting)log(txt(evNode().t,G.ev)||'','event');render();return}
  if(['inventory','i','inv','pack','bag'].includes(t)){log(`In your pack: ${G.pack.potion} Healing Draught${G.pack.potion===1?'':'s'}, ${G.pack.fire} Scroll${G.pack.fire===1?'':'s'} of Cinders, ${G.pack.map} Scroll${G.pack.map===1?'':'s'} of Far Sight, ${G.gold} gold${G.pack.weapons.length?', and '+listJoin(G.pack.weapons.map(wname)):''}.`,'sys');render();return}
  if(['party','team','companions','who'].includes(t)&&!C.some(c=>c.cmds.includes(t))){log(G.party.map(m=>`${m.hero?m.name+' (you)':m.name}, ${m.hero?CLASSES[m.cls].name:m.cls}: ${m.down?'fallen':m.hp+'/'+m.maxhp+' HP'}, ${wname(m.weapon)}`).join('. ')+'.','sys');render();return}
  if(['map','m'].includes(t)){G.log.push({t:'pre',text:mapText(false)});render();return}
  let c=C.find(c=>c.cmds.includes(t)||norm(c.label)===t);
  if(!c)c=C.find(c=>c.cmds.some(x=>x.length>2&&(x.startsWith(t)||t.startsWith(x+' '))))||C.find(c=>norm(c.label).startsWith(t)&&t.length>2)||C.find(c=>t.length>3&&norm(c.label).includes(t));
  if(!c&&/^(attack|hit|kill|fight)\b/.test(t))c=C.find(c=>c.label.startsWith('Attack'));
  if(c){c.echo=false;runChoice(c)}
  else{log(`You can’t do that right now. Type help to see commands, or pick one of the choices.`,'sys');render()}
}

/* ---------- map ---------- */
function mapText(html=true){
  if(G.cur==='town')return 'You are in Ashmoor.';
  const sp=(s,c)=>html&&c?`<span class="${c}">${s}</span>`:s;
  const lines=[];
  for(let y=0;y<GRID;y++){
    let row='',below='';
    for(let x=0;x<GRID;x++){
      const r=G.rooms[key(x,y)];let ch=' ',cls='';
      if(r&&key(x,y)===G.cur){ch='@';cls='me'}
      else if(r&&r.visited){ch=r.stairs?'▼':r.throne?'♛':r.mons.length?'!':r.event?'◆':'■';cls=r.stairs||r.throne?'st':r.event?'ev':''}
      else if(r&&r.seen){ch=(G.farSight&&r.stairs)?'▼':(G.farSight&&r.throne)?'♛':'?';cls=G.farSight&&(r.stairs||r.throne)?'st':'dim'}
      row+=sp(ch,cls);
      if(x<GRID-1){const o=G.rooms[key(x+1,y)];row+=(r&&o&&r.exits.e&&(r.visited||o.visited||G.farSight))?'───':'   '}
      const ob=G.rooms[key(x,y+1)];below+=(r&&ob&&r.exits.s&&(r.visited||ob.visited||G.farSight))?'│':' ';if(x<GRID-1)below+='   ';
    }
    lines.push(row);if(y<GRID-1)lines.push(below);
  }
  const plain=lines.map(l=>l.replace(/<[^>]+>/g,''));
  let top=0,bot=plain.length-1;while(top<bot&&!plain[top].trim())top++;while(bot>top&&!plain[bot].trim())bot--;
  const left=Math.min(...plain.slice(top,bot+1).filter(l=>l.trim()).map(l=>l.search(/\S/)));
  const out=[];for(let i=top;i<=bot;i++){let l=lines[i],n=left;while(n>0&&l.startsWith(' ')){l=l.slice(1);n--}out.push(l)}
  return out.join('\n');
}

/* ---------- render ---------- */
const escHTML=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function renderEntry(e){
  if(e.t==='scene')return `<div class="scene"><h2>${e.eyebrow?`<small>${e.eyebrow}</small>`:''}${e.title}</h2>${e.paras.map(p=>`<p>${p}</p>`).join('')}</div>`;
  if(e.t==='cmd')return `<p class="cmd">&gt; ${escHTML(e.text)}</p>`;
  if(e.t==='pre')return `<pre>${escHTML(e.text)}</pre>`;
  if(e.t==='card')return e.html;
  if(!e.text)return '';
  return `<p class="${e.cls}">${e.text}${e.detail?`<span class="d">${e.detail}</span>`:''}</p>`;
}
function render(){
  const entries=G?G.log.slice(-170):titleLog;
  const st=$('#story');st.classList.toggle('intro',!G);st.innerHTML=entries.map(renderEntry).join('');st.scrollTop=st.scrollHeight;
  choiceCache=buildChoices();
  $('#choices').innerHTML=choiceCache.map((c,i)=>`<button class="choice ${c.kind}" data-i="${i}"><span class="n">${i+1}</span><span class="l">${c.label}</span>${c.sub?`<span class="s">${c.sub}</span>`:''}</button>`).join('');
  renderSheet();
  $('#depthline').innerHTML=G?(G.cur==='town'?`Ashmoor · between chapters`:`${CHAPTERS.length>1?`Ch. ${(G.chapter||0)+1} · `:''}${G.theme} · Floor <b>${G.depth}</b> of ${FLOORS()}`):'A tale in three chapters';
  $('#cmd').placeholder=!G&&titleState.stage==='name'?'Or type your hero’s name':'Or type a command: go north, attack, search, help';
}
function renderSheet(){
  const S=$('#sheet');
  if(!G){S.innerHTML=`<div class="who"><span class="cn">Your hero</span><span class="lv">Not chosen</span></div><p class="intro-sheet">Pick a class and a name to begin. You start alone. Companions you recruit will appear here, along with your pack, your weapons and a map of each floor.</p><p class="intro-sheet">Progress saves in this browser after every choice, so you can stop and come back whenever you like.</p>`;return}
  const h=H(),c=CLASSES[h.cls];
  const lo=XPT[G.lvl-1],hi=XPT[G.lvl]??XPT[XPT.length-1];
  const xpPct=G.lvl>=XPT.length?100:Math.min(100,(G.xp-lo)/(hi-lo)*100);
  const wd=WEAPONS[h.weapon.id];
  S.innerHTML=`
  <div class="diff" role="group" aria-label="Difficulty">${DIFFS.map((d,i)=>`<button type="button" data-diff="${i}" class="${i===(G.diff??1)?'on':''}" aria-pressed="${i===(G.diff??1)}">${d.name}</button>`).join('')}</div>
  <div class="who"><span class="cn" style="color:${c.col}">${escHTML(h.name)}</span><span class="lv">${c.name} · Level ${G.lvl}</span></div>
  <div class="bars"><div class="bar"><i style="width:${Math.max(0,h.hp/h.maxhp*100)}%"></i><span>${h.hp} / ${h.maxhp} HP</span></div><div class="bar xp" title="${G.xp} XP"><i style="width:${xpPct}%"></i></div></div>
  <div class="scores">${STATS.map(s=>`<div class="score"><small>${s.toUpperCase()}</small><b>${10+h.stats[s]*2}</b><em>${sgn(h.stats[s])}</em></div>`).join('')}</div>
  <dl class="stats">
    <div><dt>Armor Class</dt><dd>${ac(h)}${h.ward?' +ward':''}</dd></div>
    <div><dt>To hit</dt><dd>${sgn(prof()+statMod(h,h.weapon)+wdef(h.weapon).bonus+(G.bless?1:0))}</dd></div>
    <div><dt>Gold</dt><dd>${G.gold}</dd></div>${h.temp?`<div><dt>Bear form</dt><dd>${h.temp} temp</dd></div>`:''}${h.rage?`<div><dt>Raging</dt><dd>${h.rage} rds</dd></div>`:''}
    <div><dt>XP</dt><dd>${G.xp}</dd></div>
  </dl>
  <div class="wpn"><b class="${wd.mythic?'m':''}">${cap(wname(h.weapon))}</b> · ${wdice(h,h.weapon)}${wd.lore?`<br><span style="color:var(--muted);font-size:.8rem">${wd.lore}</span>`:''}</div>
  <div class="abil"><h3>Class ability</h3><b>${c.abil.name}</b><span class="pips">${'●'.repeat(Math.max(0,h.charges))}${'○'.repeat(Math.max(0,maxCharges()-h.charges))}</span><p>${c.abil.desc} Recharges each floor.</p><p style="color:var(--muted)">${c.passive}</p></div>
  <div><h3>Party · ${comps().length} of ${MAX_COMPANIONS} companions</h3><div class="party">${comps().length?comps().map(m=>`<div class="mate${m.down?' down':''}" data-mate="${m.id}" role="button" tabindex="0" title="Show ${m.name}\u2019s details"><div class="top"><span class="nm" style="color:${COMPS[m.id].col}">${m.name}</span><span class="rl">${CLASSES[ckOf(m)].name} · AC ${ac(m)}</span></div><div class="bar sm"><i style="width:${Math.max(0,m.hp/m.maxhp*100)}%"></i></div><div class="ln">${m.hp}/${m.maxhp} HP · <span class="${WEAPONS[m.weapon.id].mythic?'m':''}" style="${WEAPONS[m.weapon.id].mythic?'color:var(--mythic)':''}">${wname(m.weapon)}</span>${` · ${CLASSES[ckOf(m)].abil.name} ${'●'.repeat(Math.max(0,m.charges??0))}`}${m.temp?` · bear ${m.temp}`:''}${m.rage?' · raging':''}</div><div class="ln"><span class="loy l${m.loyalty>=6?'hi':m.loyalty>=4?'mid':'lo'}">${LOYAL_WORD(m.loyalty)}</span> · values ${VALUES[m.id]}</div></div>`).join(''):`<p class="empty">No one yet. You will meet people in the dark. Some of them are worth saving.</p>`}</div></div>
  <div><h3>Pack <span class="hint">tap an item to use it</span></h3><ul class="pack">
    ${[['potion','Healing Draught'],['fire','Scroll of Cinders'],['map','Scroll of Far Sight']].map(([k,n])=>G.pack[k]?`<li><button type="button" data-item="${k}" class="${G.menu&&G.menu.item===k?'on':''}"><span>${n}</span><span>× ${G.pack[k]}</span></button></li>`:`<li class="zero"><span>${n}</span><span>× 0</span></li>`).join('')}
    ${G.pack.weapons.map((w,i)=>`<li class="${WEAPONS[w.id].mythic?'m':''}"><button type="button" data-item="w${i}" class="${G.menu&&G.menu.item==='w'+i?'on':''}"><span>${cap(wname(w))}</span><span>${dstr(WEAPONS[w.id].n,WEAPONS[w.id].d,wdef(w).bonus)}</span></button></li>`).join('')}
    ${E.has('hilt')&&!E.has('kingsbane')?`<li class="m"><span>Hilt of Kingsbane</span><span>broken</span></li>`:''}
  </ul></div>
  <div><h3>${G.cur==='town'?'Ashmoor':'Map of floor '+G.depth}</h3><pre class="map">${mapText(true)}</pre><div class="legend">@ you · ■ explored · ? unexplored · ! foes · ◆ encounter · ▼ stairs</div></div>`;
}

/* ---------- input ---------- */
$('#sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-diff]');if(b&&G){setDiff(+b.dataset.diff);return}
  const it=e.target.closest('[data-item]');if(it&&G&&!G.over){openItem(it.dataset.item);return}
  const mt=e.target.closest('[data-mate]');if(mt&&G){const c=G.party.find(m=>m.id===mt.dataset.mate);if(c){logCard(c);render()}}
});
$('#sheet').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-mate]')){e.preventDefault();e.target.click()}});
function openItem(key){
  G.menu={type:'item',item:key};
  if(key[0]==='w'){const w=G.pack.weapons[+key.slice(1)];if(!w){G.menu=null;render();return}const d=WEAPONS[w.id];
    log(`${cap(wname(w))}: ${dstr(d.n,d.d,wdef(w).bonus)}${d.extra?` +${d.extra[0]}d${d.extra[1]} ${d.extra[2]}`:''}. ${d.lore||(d.stat==='finesse'?'Uses Strength or Dexterity, whichever is higher.':d.stat==='int'?'Uses Intelligence.':d.stat==='wis'?'Uses Wisdom.':d.stat==='dex'?'Uses Dexterity.':'Uses Strength.')}`,'sys')}
  else log({potion:`Healing Draught: restores 2d4+${2+G.depth} HP. Can get a fallen companion back on their feet.`,fire:'Scroll of Cinders: 3d6 fire to every foe in the room. Fire also stops the Hollow King from mending.',map:'Scroll of Far Sight: reveals the whole floor on your map.'}[key],'sys');
  const fight=room().mons.some(m=>m.aware);
  if(key==='fire'&&!room().mons.length)log('There is nothing here to burn. Save it for a fight.','sys');
  if(key==='map'&&G.farSight)log('You can already see this whole floor.','sys');
  if(key[0]==='w'&&fight)log('There is no time to change weapons in the middle of a fight.','sys');
  render();
  if(matchMedia('(max-width:880px)').matches)$('#choices').scrollIntoView({behavior:'smooth',block:'center'});
}
function itemChoices(add,inFight){
  const key=G.menu.item,h=H(),back=()=>{G.menu=null};
  if(key==='potion'&&G.pack.potion>0){
    add('Drink it yourself',()=>{back();drink()},{sub:`${h.hp}/${h.maxhp} HP`,combat:inFight,kind:'prime'});
    for(const m of comps())add(`Give it to ${m.name}`,()=>{back();drink(m)},{sub:m.down?'Fallen: gets them back up':`${m.hp}/${m.maxhp} HP`,combat:inFight});
  }else if(key==='fire'&&G.pack.fire>0){
    if(room().mons.length)add('Read it now',()=>{back();readCinders()},{sub:`Burns ${listJoin(room().mons.map(theM))}`,combat:true,kind:'prime'});
  }else if(key==='map'&&G.pack.map>0){
    if(!G.farSight)add('Read it now',()=>{back();readFarSight()},{sub:'Reveal this floor',kind:'prime'});
  }else if(key[0]==='w'){
    const i=+key.slice(1),w=G.pack.weapons[i];
    if(w&&!inFight){add('Equip it yourself',()=>{back();equip(i,h)},{sub:`now: ${wname(h.weapon)} ${wdice(h,h.weapon)} → ${wdice(h,w)}`,kind:'prime'});
      for(const m of comps())add(`Give it to ${m.name}`,()=>{back();equip(i,m)},{sub:`${CLASSES[ckOf(m)].name} · now ${wname(m.weapon)} ${wdice(m,m.weapon)} → ${wdice(m,w)}`});
      add('Drop it',()=>{back();G.pack.weapons.splice(i,1);log(`You leave the ${wname(w)} behind.`,'sys')},{sub:'Gone for good'});}
  }
  add('Close the pack',back,{echo:false});
}
$('#choices').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)runChoice(choiceCache[+b.dataset.i])});
$('#cmdform').addEventListener('submit',e=>{e.preventDefault();const i=$('#cmd'),v=i.value;i.value='';runCommand(v)});

/* ---------- offline support ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
/* ---------- boot ---------- */
function boot(data){if(data&&data.G&&data.G.party){G=data.G;migrate(G);render()}else showTitle()}
try{window.claude?.hot?.snapshot?.(()=>({G}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>

</body>
</html>
